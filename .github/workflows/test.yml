name: test-formulae

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test each formula
        run: |
          for formula in Formula/*.rb; do
            echo "::group::Audit $formula"
            brew audit --new --strict --online "$formula" || true
            echo "::endgroup::"
            echo "::group::Install $formula"
            brew install --build-from-source "$formula"
            echo "::endgroup::"
            echo "::group::Test $formula"
            brew test "$formula"
            echo "::endgroup::"
          done
