name: test-formulae

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update Homebrew + tap third-party formula sources
        # macos-latest sets HOMEBREW_NO_AUTO_UPDATE=1; explicitly update so
        # dependencies declared in our formulas resolve correctly.
        # `bun` lives in oven-sh/bun (Bun's official tap), not homebrew-core,
        # so any formula declaring `depends_on "bun"` (e.g. agents-trace) needs
        # that tap available before audit/install runs.
        run: |
          brew update
          brew tap oven-sh/bun

      - name: Tap the working tree
        # Homebrew 4.x rejects path-based `brew install` / `brew audit`.
        # Tap the checked-out repo so the formulas are addressable as
        # `noamsiegel/tap/<name>`.
        run: |
          brew tap noamsiegel/tap "$GITHUB_WORKSPACE"

      - name: Audit, install, and test each formula
        run: |
          # Aggregate failures instead of bailing on the first one. A single
          # transient upstream issue (e.g., GitHub 502 on a release tarball)
          # shouldn't prevent every other formula from being tested.
          failed=()
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            ref="noamsiegel/tap/$name"
            echo "::group::Prepare $name"
            brew uninstall --force "$ref" >/dev/null 2>&1 || true
            echo "::endgroup::"
            echo "::group::Audit $name"
            # `audit --online` hits external URLs and can be flaky; allow failures.
            brew audit --strict --online "$ref" || true
            echo "::endgroup::"
            echo "::group::Install $name"
            if ! brew install --build-from-source "$ref"; then
              failed+=("$name (install)")
              echo "::endgroup::"
              brew uninstall --force "$ref" >/dev/null 2>&1 || true
              continue
            fi
            echo "::endgroup::"
            echo "::group::Test $name"
            if ! brew test "$ref"; then
              failed+=("$name (test)")
            fi
            echo "::endgroup::"
            echo "::group::Cleanup $name"
            brew uninstall --force "$ref" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Failed formulas: ${failed[*]}"
            exit 1
          fi
